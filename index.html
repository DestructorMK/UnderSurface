<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Undersurface">
<meta name="theme-color" content="#F7F7F5">
<title>Undersurface</title>
<style>:root{
  --ink:#111111; --paper:#F7F7F5; --rule:#D9D8D4; --mute:#6B6A66; --soft:#EDECE8; --accent:#E2401C;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --f:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{position:fixed;inset:0;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.caps{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
i,.latin{font-style:italic}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--ink);border-radius:2px;font-weight:700;font-size:15px;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.quiet{border-color:var(--rule);font-weight:400}
.btn:active{opacity:.6}
.btn[disabled]{opacity:.3;pointer-events:none}
.link{text-decoration:underline;text-underline-offset:3px;font-size:13px;min-height:44px;padding:0 2px}

.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}

/* Home */
#home{overflow-y:auto;-webkit-overflow-scrolling:touch}
.home-wrap{max-width:760px;margin:0 auto;padding:calc(40px + var(--safe-t)) 24px calc(40px + var(--safe-b))}
.wordmark{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1}
.tagline{font-size:20px;margin-top:12px;max-width:520px}
.home-actions{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.section-h{margin:48px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.rows{border-top:1px solid var(--ink)}
.row{display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center;min-height:56px;padding:8px 0;border-bottom:1px solid var(--rule);text-align:left;width:100%}
.row:active{background:var(--soft)}
.row .t{font-weight:700}
.row .s{font-size:13px;color:var(--mute)}
.row .arrow{font-size:20px}
.empty{padding:16px 0;color:var(--mute);border-bottom:1px solid var(--rule)}
.foot{margin-top:48px;padding-top:16px;border-top:1px solid var(--rule);display:flex;gap:24px;flex-wrap:wrap;align-items:center;color:var(--mute);font-size:13px}

/* Stage + bars */
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:none;background:#1a1a1a}
#stage.on{display:block}
.topbar{position:absolute;left:0;right:0;top:0;padding-top:var(--safe-t);background:var(--paper);border-bottom:1px solid var(--rule);z-index:5}
.topbar .in{height:52px;display:flex;align-items:center;gap:12px;padding:0 12px}
.topbar .title{flex:1;min-width:0}
.topbar .title b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .title span{font-size:12px;color:var(--mute)}
.back{min-height:44px;padding:0 8px;font-size:15px}
.back:before{content:"\2190\00a0"}

.scanbar{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(16px + var(--safe-b));display:flex;justify-content:center;z-index:5}
.shutter{width:76px;height:76px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.shutter i{display:block;width:62px;height:62px;border-radius:50%;background:#fff}
.shutter:active i{background:#ddd}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(112px + var(--safe-b));background:var(--ink);color:var(--paper);padding:8px 12px;border-radius:2px;font-size:13px;z-index:5;white-space:nowrap}

/* tier rail */
.rail{position:absolute;right:12px;z-index:5;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--ink);border-radius:2px}
.rail button{min-width:64px;min-height:48px;padding:4px 8px;border-bottom:1px solid var(--rule);text-align:center}
.rail button:last-child{border-bottom:0}
.rail button b{display:block;font-size:15px}
.rail button span{display:block;font-size:10px;color:var(--mute);letter-spacing:.04em}
.rail button.on{background:var(--ink);color:var(--paper)}
.rail button.on span{color:#bbb}

/* tool panel */
.panel{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);z-index:5;padding-bottom:var(--safe-b)}
.tabs{display:flex;border-bottom:1px solid var(--rule)}
.tabs button{flex:1;min-height:44px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.pane{display:none;padding:12px 16px 14px;min-height:112px}
.pane.on{display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.readout{margin-top:10px;font-size:13px;color:var(--mute);min-height:20px}
.readout b{color:var(--ink)}
.timeline{display:flex;align-items:center;gap:12px}
.timeline input{flex:1}
input[type=range]{-webkit-appearance:none;appearance:none;height:44px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);margin-top:-11px}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.ticks{position:relative;height:14px;margin:0 11px}
.ticks i{position:absolute;top:0;width:1px;height:8px;background:var(--mute)}
.ticks i.now{background:var(--ink);height:14px;width:2px}
.ticks i.ev{background:var(--accent);height:10px}
.timeinfo{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(17,17,17,.4);z-index:20;display:none}
.scrim.on{display:block}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:600px;max-height:88%;overflow-y:auto;background:var(--paper);border-top:1px solid var(--ink);padding:20px 20px calc(24px + var(--safe-b))}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.sheet-h h2{font-size:20px;line-height:1.2}
.sheet p{margin-bottom:10px}
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.choice button{border:1px solid var(--rule);border-radius:2px;min-height:56px;font-weight:700}
.choice button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.choice button small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.choice button.on small{color:#bbb}
.entry{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:start}
.entry img{width:120px;height:120px;background:var(--soft)}
.entry ul{padding-left:16px;margin-top:8px}
.entry li{margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:0;border-top:1px solid var(--ink);border-left:1px solid var(--rule)}
.cell{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:10px;text-align:left;min-height:170px}
.cell img{width:100%;aspect-ratio:1;display:block}
.cell b{display:block;font-size:13px;margin-top:6px}
.cell span{font-size:11px;color:var(--mute)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.opt input{margin-top:3px;width:18px;height:18px;accent-color:var(--ink)}
.feedback{margin-top:16px;padding:12px;border-left:3px solid var(--ink);background:var(--soft)}
.feedback.good{border-left-color:#2E7D4F}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--rule);border-radius:2px;min-height:36px;padding:0 10px;font-size:13px}
.chips button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}

#toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(68px + var(--safe-t));background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:2px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
#toast.on{opacity:1}

@media (max-width:600px){
  .wordmark{font-size:32px}.tagline{font-size:17px}
  .entry{grid-template-columns:88px 1fr}.entry img{width:88px;height:88px}
  .rail button{min-width:56px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
#scan,#xray{pointer-events:none}
#scan>*,#xray>*{pointer-events:auto}
#scan .hint{pointer-events:none}
.topbar .title span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-only{display:none}
@media (max-width:600px){
  .topbar .in{gap:6px;padding:0 8px}
  .topbar .btn{min-height:36px;padding:0 10px;font-size:13px}
  .hide-sm{display:none}.sm-only{display:inline}
  .rail button span{display:none}.rail button{min-height:44px;min-width:52px}
  .back{padding:0 4px}
}
</style>
</head>
<body>
<canvas id="stage" aria-label="Camera view with x-ray lens"></canvas>
<video id="cam" playsinline muted autoplay style="display:none"></video>

<section id="home" class="screen on"><div class="home-wrap">
  <div class="caps">Prototype 0.1 · NC State</div>
  <h1 class="wordmark" style="margin-top:12px">Undersurface</h1>
  <p class="tagline">Point your camera at a wall, carpet or floor and see the ecosystem living inside it.</p>
  <div class="home-actions"><button class="btn primary" id="bScan">Scan a surface</button><button class="btn" id="bSample">Use a sample surface</button></div>
  <div class="section-h"><span class="caps" style="color:var(--ink)">Your sites</span><span class="caps" id="siteCount"></span></div>
  <div class="rows" id="sites"></div>
  <div class="section-h"><span class="caps" style="color:var(--ink)">Case files</span></div>
  <div class="rows" id="cases"></div>
  <div class="foot"><button class="link" id="bGuide">Field guide</button><button class="link" id="bLog">Research log</button><span id="logCount" class="num"></span><button class="link" id="bDev">Dev: skip 1 day</button><button class="link" id="bReset">Reset</button></div>
</div></section>

<section id="scan" class="screen">
  <div class="topbar"><div class="in"><button class="back" id="sBack">Back</button><div class="title"><b>Scan a surface</b><span>Hold 20–40 cm away and fill the frame</span></div></div></div>
  <div class="hint">One surface inside the corners, then tap scan</div>
  <div class="scanbar"><button class="shutter" id="bShutter" aria-label="Scan surface"><i></i></button></div>
</section>

<section id="xray" class="screen">
  <div class="topbar"><div class="in"><button class="back" id="xBack">Sites</button><div class="title"><b id="xName"></b><span id="xSub" class="num"></span></div><button class="btn quiet" id="bCase">Case</button><button class="btn quiet" id="bXGuide"><span class="hide-sm">Field guide</span><span class="sm-only">Guide</span></button></div></div>
  <div class="rail" id="rail"></div>
  <div class="panel">
    <div class="tabs"><button data-tab="measure">Measure</button><button data-tab="act">Act</button><button data-tab="time">Time</button></div>
    <div class="pane" id="p-measure">
      <div class="tools"><button class="btn" data-m="rh">Humidity</button><button class="btn" data-m="temp">Temperature</button><button class="btn" data-m="count">Count organisms</button><button class="btn quiet" id="bGraph">Graph</button></div>
      <div class="readout" id="readout"></div>
    </div>
    <div class="pane" id="p-act"><div class="tools" id="acts"></div><div class="readout" id="actNote"></div></div>
    <div class="pane" id="p-time">
      <div class="timeline"><span class="caps">Start</span><input type="range" id="scrub" min="0" step="1" aria-label="Time"><span class="caps" id="maxL"></span></div>
      <div class="ticks" id="ticks"></div>
      <div class="timeinfo"><span id="timeLabel" class="num"></span><span class="tools"><button class="btn quiet" id="bNow">Back to today</button><button class="btn" id="bCommit">Skip ahead to here</button></span></div>
    </div>
  </div>
</section>

<section id="guide" class="screen" style="overflow-y:auto">
  <div class="topbar" style="position:sticky"><div class="in"><button class="back" id="gBack">Back</button><div class="title"><b>Field guide</b><span id="gSub"></span></div></div></div>
  <div style="max-width:960px;margin:0 auto;padding:24px 16px calc(32px + var(--safe-b))"><div class="grid" id="ggrid"></div></div>
</section>

<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog"></div></div>
<div id="toast" role="status"></div>
<script>// Undersurface — ecosystem model (deterministic, one step = one simulated day)
const SPECIES = {
  dustmite: { name: 'Dust mite', latin: 'Dermatophagoides pteronyssinus', tier: 2, color: '#E8DCC2', ink: '#8A7650',
    r: 0.09, K0: 600, rhOpt: 75, rhW: 22, rhMin: 52, dry: 0.09, food: true, per: 40, speed: 0.05,
    facts: ['About 0.3 mm long, so you need a microscope to see one.', 'Eats flakes of dead human skin. One person sheds enough each day to feed thousands.', 'Cannot drink. It absorbs water from humid air, so dry air below about 50% humidity slowly kills it.'] },
  predmite: { name: 'Predatory mite', latin: 'Cheyletus eruditus', tier: 2, color: '#D9653B', ink: '#8C3517',
    prey: { dustmite: 1, booklouse: 0.5 }, a: 1.4, H: 180, e: 0.06, m: 0.045, per: 3, speed: 0.11,
    facts: ['A hunter that ambushes dust mites and grabs them with hooked mouthparts.', 'Its numbers rise and fall a step behind its prey.', 'Like dust mites, it needs humid air to survive.'], rhMin: 45, dry: 0.05 },
  beetle: { name: 'Carpet beetle larva', latin: 'Anthrenus verbasci', tier: 1, color: '#7A5634', ink: '#3F2A17',
    r: 0.03, K0: 14, rhOpt: 60, rhW: 30, food: true, per: 1.2, speed: 0.025,
    facts: ['A fuzzy, striped larva often called a "woolly bear".', 'Eats wool, hair, feathers and dead insects. It can chew holes in rugs.', 'Adults are small round beetles that fly outside to eat pollen.'] },
  booklouse: { name: 'Booklouse', latin: 'Liposcelis bostrychophila', tier: 2, color: '#F1EBDD', ink: '#9C8F72',
    prey: { mold: 1 }, a: 0.3, H: 40, e: 0.5, m: 0.04, rhMin: 58, dry: 0.08, per: 4, speed: 0.07,
    facts: ['Under 1 mm long. Not a real louse, and harmless to people.', 'Grazes on microscopic mold, so it shows up where things are damp.', 'Dries out fast when the air gets dry.'] },
  mold: { name: 'Mold', latin: 'Aspergillus / Cladosporium', tier: 3, color: '#4E6B57', ink: '#2C3D31',
    r: 0.14, K0: 200, rhOpt: 88, rhW: 26, rhMin: 50, dry: 0.08, per: 18, speed: 0, colony: true,
    facts: ['A fungus made of thread-like hyphae that spread through damp material.', 'Releases spores that drift on the air. They are everywhere, waiting for moisture.', 'Grows fastest in damp air above about 70% humidity. Dry air makes it die back.'] },
  silverfish: { name: 'Silverfish', latin: 'Lepisma saccharinum', tier: 1, color: '#A9B1B8', ink: '#5B656E',
    r: 0.04, K0: 40, rhOpt: 80, rhW: 22, rhMin: 55, dry: 0.03, food: true, per: 2, speed: 0.06,
    facts: ['One of the oldest kinds of insect, with no wings and a silvery body.', 'Eats starches such as wallpaper paste, glue and paper inside walls.', 'Likes dark, damp spaces and can live for months without food.'] },
  spider: { name: 'House spider', latin: 'Parasteatoda tepidariorum', tier: 1, color: '#5A4A3C', ink: '#2B221A',
    prey: { silverfish: 1, booklouse: 0.3 }, a: 0.15, H: 12, e: 0.12, m: 0.012, per: 1, speed: 0.012,
    facts: ['Builds tangled cobwebs in quiet corners and wall cavities.', 'Eats silverfish, booklice and other small insects.', 'A single spider can keep a silverfish population in check.'] },
  springtail: { name: 'Springtail', latin: 'Entomobrya sp.', tier: 2, color: '#8E9AAF', ink: '#4A556B',
    prey: { fungus: 1 }, a: 0.15, H: 60, e: 0.5, m: 0.02, rhMin: 55, dry: 0.07, per: 4, speed: 0.09,
    facts: ['Not an insect: a six-legged relative with a spring-loaded tail called a furcula.', 'Flicks its tail to jump many times its own length.', 'Eats fungi and needs moisture. A sign of damp wood or soil.'] },
  fungus: { name: 'Wet-rot fungus', latin: 'Coniophora puteana', tier: 3, color: '#E9E4D6', ink: '#8E8670',
    r: 0.1, K0: 150, rhOpt: 85, rhW: 26, rhMin: 48, dry: 0.07, per: 16, speed: 0, colony: true,
    facts: ['Grows white threads through wood that stays damp.', 'Digests the cellulose in wood, making it soft and crumbly.', 'Softened wood is easier for wood-boring larvae to eat.'] },
  woodworm: { name: 'Furniture beetle larva', latin: 'Anobium punctatum', tier: 1, color: '#EFE3C8', ink: '#8A6F3E',
    r: 0.02, K0: 10, rhOpt: 75, rhW: 25, food: false, boost: 'fungus', per: 1, speed: 0.008,
    facts: ['A C-shaped grub, better known as woodworm, that tunnels inside wood for years.', 'Prefers damp wood, especially wood already softened by fungi.', 'Adults chew their way out, leaving tiny round exit holes.'] },
};

const BIOMES = {
  carpet: { name: 'Carpet', rh: 60, start: { dustmite: 380, predmite: 6, beetle: 5, booklouse: 12, mold: 30 } },
  wall:   { name: 'Wall',   rh: 58, start: { silverfish: 10, spider: 2, booklouse: 18, mold: 40 } },
  floor:  { name: 'Floor',  rh: 57, start: { springtail: 30, fungus: 25, woodworm: 3, dustmite: 120, predmite: 0 } },
};

const PREDATOR_FOR = { carpet: ['predmite', 12], wall: ['spider', 2], floor: ['predmite', 10] };

const ACTIONS = {
  water:      { label: 'Spill water', note: 'Humidity jumps, then dries out over a few days.' },
  vacuum:     { label: 'Vacuum', note: 'Removes many larger creatures and some food.' },
  dehumidify: { label: 'Dehumidifier', note: 'Runs for three weeks and keeps the air dry.' },
  predator:   { label: 'Add predator', note: 'Releases predators into this patch.' },
  food:       { label: 'Add food', note: 'Adds crumbs, skin flakes or paper, depending on the surface.' },
};

function hash(n) { // deterministic 0..1
  n = (n ^ 61) ^ (n >>> 16); n = (n + (n << 3)) | 0; n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15);
  return ((n >>> 0) % 100000) / 100000;
}
function noise(seed, d, k) { return hash(seed * 7919 + d * 131 + k * 17) * 2 - 1; }

function envAt(site, d) {
  const b = BIOMES[site.biome];
  let rh = (site.rh0 || b.rh) + 4 * Math.sin(2 * Math.PI * d / 30 + (site.seed % 7)) + 1.5 * noise(site.seed, d, 1);
  let temp = 21 + 1.2 * Math.sin(2 * Math.PI * d / 30 + 1 + (site.seed % 5)) + 0.4 * noise(site.seed, d, 2);
  let food = 1;
  for (const e of site.events) {
    const dt = d - e.day; if (dt < 0) continue;
    if (e.type === 'water') rh += 30 * Math.exp(-dt / 4);
    if (e.type === 'dehumidify') rh -= 24 * (dt < 21 ? 1 : Math.exp(-(dt - 21) / 4));
    if (e.type === 'heating') { rh -= 30 * Math.min(1, dt / 3); temp += 3 * Math.min(1, dt / 3); }
    if (e.type === 'food') food += 1.4 * Math.exp(-dt / 10);
    if (e.type === 'vacuum') food -= 0.6 * Math.exp(-dt / 7);
  }
  return { rh: Math.max(18, Math.min(98, rh)), temp, food: Math.max(0.15, food) };
}

function step(site, pops, d) {
  const env = envAt(site, d);
  for (const e of site.events) if (e.day === d) {
    if (e.type === 'vacuum') for (const s in pops) { const t = SPECIES[s].tier; pops[s] *= t === 1 ? 0.35 : t === 2 ? 0.6 : 0.9; }
    if (e.type === 'predator') { const [p, n] = PREDATOR_FOR[site.biome]; pops[p] = (pops[p] || 0) + n; }
  }
  const next = { ...pops };
  const eaten = {};
  for (const s in pops) {
    const sp = SPECIES[s]; if (!sp.prey) continue;
    let gain = 0;
    for (const p in sp.prey) {
      if (!(p in pops)) continue;
      const c = sp.a * sp.prey[p] * pops[s] * pops[p] / (pops[p] + sp.H);
      eaten[p] = (eaten[p] || 0) + c; gain += c;
    }
    next[s] += sp.e * gain - sp.m * pops[s];
  }
  for (const s in pops) {
    const sp = SPECIES[s];
    if (sp.r) {
      const suit = Math.exp(-Math.pow((env.rh - sp.rhOpt) / sp.rhW, 2));
      let K = sp.K0 * Math.max(0.05, suit) * (sp.food ? env.food : 1);
      if (sp.boost && pops[sp.boost] != null) K *= 0.4 + Math.min(1.2, pops[sp.boost] / 100);
      next[s] += Math.max(-0.12 * pops[s], sp.r * (1 + 0.15 * noise(site.seed, d, s.length)) * pops[s] * (1 - pops[s] / K));
    }
    if (sp.rhMin && env.rh < sp.rhMin) next[s] -= sp.dry * pops[s] * Math.min(1.2, (sp.rhMin - env.rh) / 14);
    next[s] -= eaten[s] || 0;
    next[s] = Math.max(0, next[s]);

}

// ---------- surface classifier (heuristic stand-in for the trained model) ----------
function classify(src, sw, sh) {
  const N = 128, cv = document.createElement('canvas'); cv.width = cv.height = N;
  const x = cv.getContext('2d', { willReadFrequently: true });
  const side = Math.min(sw, sh) * 0.6; x.drawImage(src, (sw - side) / 2, (sh - side) / 2, side, side, 0, 0, N, N);
  const d = x.getImageData(0, 0, N, N).data, g = new Float32Array(N * N); let R = 0, G = 0, B = 0;
  for (let i = 0; i < N * N; i++) { const r = d[i * 4], gg = d[i * 4 + 1], b = d[i * 4 + 2]; R += r; G += gg; B += b; g[i] = 0.299 * r + 0.587 * gg + 0.114 * b; }
  R /= N * N; G /= N * N; B /= N * N;
  let mag = 0, jxx = 0, jyy = 0, jxy = 0, n = 0;
  for (let y = 1; y < N - 1; y++) for (let xx = 1; xx < N - 1; xx++) {
    const i = y * N + xx;
    const gx = (g[i - N + 1] + 2 * g[i + 1] + g[i + N + 1]) - (g[i - N - 1] + 2 * g[i - 1] + g[i + N - 1]);
    const gy = (g[i + N - 1] + 2 * g[i + N] + g[i + N + 1]) - (g[i - N - 1] + 2 * g[i - N] + g[i - N + 1]);
    mag += Math.hypot(gx, gy); jxx += gx * gx; jyy += gy * gy; jxy += gx * gy; n++;
  }
  mag /= n; const coh = Math.sqrt((jxx - jyy) ** 2 + 4 * jxy * jxy) / (jxx + jyy + 1e-6);
  const warm = (R - B) / 255;
  const sig = v => 1 / (1 + Math.exp(-v));
  const flat = sig((22 - mag) / 5);
  const grain = sig((coh - 0.32) / 0.07 + warm * 2);
  const scores = { wall: flat, floor: (1 - flat) * grain, carpet: (1 - flat) * (1 - grain) };
  const best = Object.keys(scores).sort((a, b) => scores[b] - scores[a])[0];
  return { best, conf: scores[best], scores, color: [R, G, B], features: { mag: +mag.toFixed(1), coh: +coh.toFixed(3), warm: +warm.toFixed(3) } };
}

}

const SERIES_LABEL = k => k === 'rh' ? 'Humidity (%)' : k === 'temp' ? 'Temperature (°C)' : `${spName(k.slice(4))} (estimated count)`;

    <div class="chips">${keys.map(k => `<button data-k="${k}" class="${k === sel ? 'on' : ''}">${esc(SERIES_LABEL(k).replace(/ \(.*\)/, ''))}</button>`).join('')}</div>

    <p class="caps" style="margin-top:8px">${pts.length} reading${pts.length === 1 ? '' : 's'}${pts.length < 2 ? ' · take more on other days to see a trend' : ''}</p>`, el => {

  const X = d => L + d / maxDay * (Wd - L - Rm), Y = v => T + (1 - (v - ymin) / (ymax - ymin)) * (Ht - T - Bm);
  const nice = (ymax - ymin) / 4; let ty = ''; for (let i = 0; i <= 4; i++) { const v = ymin + nice * i; ty += `<line x1="${L}" x2="${Wd - Rm}" y1="${Y(v)}" y2="${Y(v)}" stroke="#D9D8D4" stroke-width="1"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="#6B6A66">${key === 'temp' ? v.toFixed(0) : Math.round(v)}</text>`; }
  let tx = ''; const step = maxDay > 70 ? 14 : 7; for (let d = 0; d <= maxDay; d += step) tx += `<text x="${X(d)}" y="${Ht - 10}" text-anchor="middle" font-size="11" fill="#6B6A66">W${d / 7 + 1}</text>`;
  const line = pts.map(p => `${X(p.day).toFixed(1)},${Y(p.value).toFixed(1)}`).join(' ');
  const evs = site.events.filter(e => !e.hidden).map(e => `<line x1="${X(e.day)}" x2="${X(e.day)}" y1="${T}" y2="${Ht - Bm}" stroke="#E2401C" stroke-width="1" stroke-dasharray="3 3"/><text x="${X(e.day) + 4}" y="${T + 10}" font-size="10" fill="#E2401C">${esc(ACTIONS[e.type] ? ACTIONS[e.type].label : e.type)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="${esc(SERIES_LABEL(key))} over time" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">${ty}${tx}<line x1="${L}" x2="${Wd - Rm}" y1="${Ht - Bm}" y2="${Ht - Bm}" stroke="#111"/>${evs}
    ${pts.length > 1 ? `<polyline points="${line}" fill="none" stroke="#111" stroke-width="1.5"/>` : ''}${pts.map(p => `<circle cx="${X(p.day)}" cy="${Y(p.value)}" r="3.5" fill="#F7F7F5" stroke="#111" stroke-width="1.5"/>`).join('')}</svg>`;
}

// ---------- field guide ----------
function speciesSheet(id, fromTap) {
  const sp = SPECIES[id], g = store.guide[id] || { seen: 0 };
  const found = Object.keys(BIOMES).filter(b => sp && BIOMES[b].start[id] != null).map(b => BIOMES[b].name.toLowerCase()).join(', ');
  sheet(`<div class="sheet-h"><div><div class="caps">Field guide · ${TIERS[sp.tier].name} ${TIERS[sp.tier].mag}</div><h2>${sp.name}</h2><div class="latin">${sp.latin}</div></div><button class="btn quiet" data-close>Done</button></div>
    <div class="entry"><img src="${thumb(id)}" alt="${sp.name}"><div><ul>${sp.facts.map(f => `<li>${f}</li>`).join('')}</ul></div></div>
    <p class="caps" style="margin-top:16px">Lives in ${found} · Spotted ${g.seen} time${g.seen === 1 ? '' : 's'}</p>`);
}
function spot(id) {
  const first = !store.guide[id];
  store.guide[id] = { seen: ((store.guide[id] || {}).seen || 0) + 1, first: (store.guide[id] || {}).first || new Date().toISOString() };
  save(); log('organism_tap', { site: site && site.id, species: id, first, tier });
  if (first) toast(`New in your field guide: ${SPECIES[id].name}`);
  speciesSheet(id, true);
}
function renderGuide() {
  const ids = Object.keys(SPECIES), n = ids.filter(i => store.guide[i]).length;
  $('gSub').textContent = `${n} of ${ids.length} found`;
  $('ggrid').innerHTML = ids.map(i => { const f = store.guide[i]; return `<button class="cell" data-g="${i}" ${f ? '' : 'disabled'}><img src="${thumb(i, !f)}" alt=""><b>${f ? SPECIES[i].name : 'Not yet found'}</b><span>${f ? `<i>${SPECIES[i].latin}</i>` : TIERS[SPECIES[i].tier].name + ' ' + TIERS[SPECIES[i].tier].mag}</span></button>`; }).join('');
  $('ggrid').querySelectorAll('[data-g]').forEach(b => b.onclick = () => speciesSheet(b.dataset.g));
}
$('bGuide').onclick = () => { prevScreen = 'home'; show('guide'); log('guide_open', { from: 'home' }); };
$('bXGuide').onclick = () => { prevScreen = 'xray'; show('guide'); log('guide_open', { from: 'xray' }); };
$('gBack').onclick = () => show(prevScreen);
$('xBack').onclick = () => { stopCamera(); site = null; show('home'); };
$('sBack').onclick = () => { stopCamera(); show('home'); };

// ---------- mystery ----------
const CAUSES = [['pred', 'Predatory mites ate them'], ['vac', 'Someone vacuumed the carpet'], ['dry', 'The air became too dry'], ['food', 'They ran out of food']];
function caseBrief() {
  log('case_brief', { case: 'mites' });
  sheet(`<div class="sheet-h"><div><div class="caps">Case file</div><h2>The vanishing mites</h2></div><button class="btn quiet" data-close>Close</button></div>
    <p>Four weeks ago, Maya's bedroom carpet held a healthy dust-mite colony. Today it has almost disappeared.</p>
    <p>Use <b>Time</b> to look back at earlier weeks, <b>Measure</b> what you find, and work out what changed. When you're ready, open <b>Case</b> and make your claim.</p>
    <button class="btn primary" data-close style="width:100%;margin-top:8px">Start investigating</button>`);
}
$('bCase').onclick = claimSheet;
function claimSheet() {
  const rs = site.readings.slice().sort((a, b) => a.day - b.day);
  const lbl = r => r.kind === 'rh' ? `Humidity ${r.value}%` : r.kind === 'temp' ? `Temperature ${r.value} °C` : `${spName(r.species)} ≈ ${r.value}`;
  sheet(`<div class="sheet-h"><div><div class="caps">Claim board</div><h2>What made the mites vanish?</h2></div><button class="btn quiet" data-close>Close</button></div>
    <div class="caps">1. Your claim</div>
    ${CAUSES.map(([k, t]) => `<label class="opt"><input type="radio" name="cause" value="${k}"><span>${t}</span></label>`).join('')}
    <div class="caps" style="margin-top:20px">2. Pin your evidence</div>
    ${rs.length ? rs.map((r, i) => `<label class="opt"><input type="checkbox" value="${i}"><span>${lbl(r)} <span class="caps">${dayLabel(r.day)}</span></span></label>`).join('') : `<p class="readout">No readings yet. Go back in time with Time, then use Measure.</p>`}
    <button class="btn primary" id="bClaim" style="width:100%;margin-top:16px">Submit explanation</button>
    <div id="fb"></div>`, el => {
    $('bClaim').onclick = () => {
      const c = (el.querySelector('input[name=cause]:checked') || {}).value;
      if (!c) { toast('Choose a claim first'); return; }
      const ev = [...el.querySelectorAll('input[type=checkbox]:checked')].map(i => rs[+i.value]);
      const hum = ev.filter(r => r.kind === 'rh');
      const before = hum.some(r => r.day < 8 && r.value >= 55), after = hum.some(r => r.day >= 10 && r.value <= 48);
      const mites = ev.filter(r => r.kind === 'pop' && r.species === 'dustmite');
      let msg, good = false;
      if (c === 'dry' && before && after) { good = true; msg = `<b>Strong explanation.</b> Humidity fell from above 55% to below 48% around week 2, when the heating came on. Dust mites can't drink. They absorb water from the air, so dry air dehydrated the colony.${mites.length >= 2 ? ' Your mite counts show the crash following the drop.' : ' Add mite counts from before and after to make it airtight.'}`; }
      else if (c === 'dry') msg = `<b>Right idea, thin evidence.</b> Pin a humidity reading from before the change (week 1) and one from after (week 3 or later) to show the air really dried out.`;
      else if (c === 'pred') msg = `<b>Check the predators.</b> Count predatory mites over time. If they ate the colony, their numbers should rise as dust mites fall. Do they?`;
      else if (c === 'vac') msg = `<b>Look at the timeline.</b> Vacuuming removes mites at once and they bounce back. Was this a single drop, or a steady decline? What else changed?`;
      else msg = `<b>Think about the food.</b> Maya still lives there and sheds skin every day. What else does a dust mite need besides food?`;
      el.querySelector('#fb').innerHTML = `<div class="feedback ${good ? 'good' : ''}">${msg}</div>`;
      log('claim_submit', { case: 'mites', cause: c, evidence: ev.length, humidity_before: before, humidity_after: after, correct: good });
      if (good) { store.cases.mites = { ...(store.cases.mites || {}), solved: true, solvedAt: new Date().toISOString() }; save(); }
    };
  });
}

// ---------- research log ----------
$('bLog').onclick = () => {
  sheet(`<div class="sheet-h"><div><div class="caps">NC State research</div><h2>Research log</h2></div><button class="btn quiet" data-close>Done</button></div>
    <p>This device has logged <b class="num">${store.log.length}</b> events. Each event records what was tapped, measured or changed, with a time, a random install ID and a random session ID.</p>
    <p>No names, photos or camera images are stored or sent anywhere. The log stays on this device until you download it.</p>
    <div class="tools"><button class="btn primary" id="bDl">Download JSON</button><button class="btn" id="bCopy">Copy</button></div>`, () => {
    const data = () => JSON.stringify({ app: 'undersurface', version: '0.1', exported: new Date().toISOString(), install: store.install, events: store.log }, null, 1);
    $('bDl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data()], { type: 'application/json' })); a.download = `undersurface-log-${store.install}-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click(); a.remove(); };
    $('bCopy').onclick = async () => { try { await navigator.clipboard.writeText(data()); toast('Log copied'); } catch (e) { toast('Copy not allowed here. Use Download.'); } };
  });
};
$('bReset').onclick = () => sheet(`<div class="sheet-h"><h2>Erase everything?</h2><button class="btn quiet" data-close>Cancel</button></div><p>Deletes all sites, the field guide, case progress and the research log on this device.</p><button class="btn primary" id="bErase" style="width:100%">Erase</button>`, () => {
  $('bErase').onclick = () => { store = { v: 1, install: rid(), sites: [], guide: {}, log: [], cases: {} }; save(); closeSheet(); renderHome(); toast('Erased'); };
});
$('bDev').onclick = () => { store.sites.forEach(s => s.anchorReal -= 86400000); save(); renderHome(); toast('Moved every site 1 real day (1 simulated week) forward'); };

// ---------- stage: layout, input, rendering ----------
const stage = $('stage'), ctx = stage.getContext('2d');
let W = 0, H = 0, DPR = 1, area = { t: 0, b: 0 };
function layout() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  if (stage.width !== Math.round(W * DPR) || stage.height !== Math.round(H * DPR)) { stage.width = Math.round(W * DPR); stage.height = Math.round(H * DPR); }
  if (mode === 'xray') {
    const top = document.querySelector('#xray .topbar').offsetHeight, bot = document.querySelector('#xray .panel').offsetHeight;
    area = { t: top, b: H - bot };
    const ah = area.b - area.t, railW = 88;
    const R = Math.round(Math.max(90, W < 600 ? Math.min(W * 0.44, ah * 0.42) : Math.min((W - railW * 2) * 0.5, ah * 0.44, 340)));
    if (R !== lens.R) { lens.R = R; _cut = {}; agents.forEach(a => a.size = sizeFor(a)); }
    if (!lens.placed) { lens.x = W / 2; lens.y = area.t + ah / 2; }
    clampLens();
    $('rail').style.top = (top + 12) + 'px';
  }
}
function clampLens() { lens.x = clamp(lens.x, lens.R * 0.6, W - lens.R * 0.6); lens.y = clamp(lens.y, area.t + lens.R * 0.6, area.b - lens.R * 0.6); }
addEventListener('resize', layout);

const ptrs = new Map(); let drag = null, pinch = null, lastWheel = 0;
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (mode !== 'xray') return;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) }; drag = null; return; }
  drag = { x0: e.clientX, y0: e.clientY, ox: lens.x - e.clientX, oy: lens.y - e.clientY, inLens: Math.hypot(e.clientX - lens.x, e.clientY - lens.y) < lens.R, moved: false };
});
stage.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = d / pinch.d0;
    if (r > 1.35) { setTier(tier + 1); pinch.d0 = d; } else if (r < 0.74) { setTier(tier - 1); pinch.d0 = d; }
    return;
  }
  if (drag) {
    if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 8) drag.moved = true;
    if (drag.moved && drag.inLens) { lens.x = e.clientX + drag.ox; lens.y = e.clientY + drag.oy; lens.placed = true; clampLens(); }
  }
});
function endPtr(e) {
  if (drag && !drag.moved && ptrs.size === 1 && mode === 'xray') tap(e.clientX, e.clientY);
  if (drag && drag.moved && drag.inLens) log('lens_move', {});
  ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) drag = null;
}
stage.addEventListener('pointerup', endPtr); stage.addEventListener('pointercancel', endPtr);
stage.addEventListener('wheel', e => { e.preventDefault(); if (mode !== 'xray' || performance.now() - lastWheel < 350 || Math.abs(e.deltaY) < 4) return; lastWheel = performance.now(); setTier(tier + (e.deltaY < 0 ? 1 : -1)); }, { passive: false });

function tap(x, y) {
  if (Math.hypot(x - lens.x, y - lens.y) > lens.R) { lens.x = x; lens.y = y; lens.placed = true; clampLens(); return; }
  let best = null, bd = 1e9;
  for (const a of agents) {
    const ax = lens.x + a.u * lens.R, ay = lens.y + a.v * lens.R, d = Math.hypot(x - ax, y - ay);
    const hit = a.speck ? 22 : Math.max(26, a.size * (SPECIES[a.s].colony ? 0.4 : 0.6));
    if (d < hit && d < bd) { bd = d; best = a; }
  }
  if (!best) return;
  if (best.speck) { toast(`Something tiny is here. Zoom in to ${TIERS[SPECIES[best.s].tier].name} ${TIERS[SPECIES[best.s].tier].mag} to see it.`); log('speck_tap', { species: best.s, tier }); return; }
  spot(best.s);
}

function sizeFor(a) {
  const sp = SPECIES[a.s], R = lens.R;
  if (a.speck) return 2 + (4 - sp.tier) * 0.5;
  if (sp.colony) return R * (0.3 + 0.45 * Math.min(1, a.pop / 120)) * (0.8 + a.r * 0.4);
  return R * (SIZE[a.s] || 0.25) * (0.85 + a.r * 0.3);
}
function syncAgents(st) {
  for (const s in st.pops) {
    const sp = SPECIES[s], pop = st.pops[s];
    let full = 0, specks = 0;
    if (sp.tier === tier) full = Math.min(sp.colony ? 5 : 14, Math.round(pop / sp.per));
    else if (sp.tier > tier) specks = Math.min(28, Math.round(pop / sp.per * 1.5));
    for (const [want, speck] of [[full, false], [specks, true]]) {
      const mine = agents.filter(a => a.s === s && a.speck === speck);
      for (let i = mine.length; i < want; i++) {
        const ang = Math.random() * Math.PI * 2, rr = Math.sqrt(Math.random()) * 0.8;
        const a = { s, speck, u: Math.cos(ang) * rr, v: Math.sin(ang) * rr, a: Math.random() * 7, r: Math.random(), seed: (Math.random() * 1e6) | 0, pop, ph: Math.random() * 10 };
        a.size = sizeFor(a); agents.push(a);
      }
      if (mine.length > want) { const drop = new Set(mine.slice(want)); agents = agents.filter(a => !drop.has(a)); }
      if (sp.colony && !speck) mine.slice(0, want).forEach(a => { if (Math.abs(a.pop - pop) > 3) { a.pop = pop; a.size = sizeFor(a); } });
    }
  }
}
let _cut = {};
function cut() {
  const D = Math.round(lens.R * 2 * DPR), k = tier + '|' + D;
  return _cut[k] || (_cut[k] = cutaway(site.biome, tier, D, site.color && !site.mystery ? site.color : SAMPLE_COLOR[site.biome], site.seed));
}
function drawCover(src, sw, sh) { const s = Math.max(W / sw, H / sh), w = sw * s, h = sh * s; ctx.drawImage(src, (W - w) / 2, (H - h) / 2, w, h); }

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000;
  if (mode === 'scan' || mode === 'xray') {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0, 0, W, H);
    const src = bgSource(); if (src) drawCover(...src);
    if (mode === 'scan') drawReticle();
    if (mode === 'xray' && site) drawXray(t, dt);
  }
  requestAnimationFrame(frame);
}
function drawReticle() {
  const s = Math.min(W, H) * 0.5, x = (W - s) / 2, y = (H - s) / 2, L = 28;
  ctx.fillStyle = 'rgba(17,17,17,0.35)'; ctx.fillRect(0, 0, W, H); ctx.clearRect(x, y, s, s);
  const src = bgSource(); if (src) { ctx.save(); ctx.beginPath(); ctx.rect(x, y, s, s); ctx.clip(); drawCover(...src); ctx.restore(); }
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  [[x, y, 1, 1], [x + s, y, -1, 1], [x, y + s, 1, -1], [x + s, y + s, -1, -1]].forEach(([cx, cy, dx, dy]) => { ctx.beginPath(); ctx.moveTo(cx + dx * L, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy + dy * L); ctx.stroke(); });
}
function drawXray(t, dt) {
  updateTimeUI();
  const st = stateAt(site, viewDay()); syncAgents(st);
  const { x, y, R } = lens;
  ctx.fillStyle = 'rgba(17,17,17,0.4)'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.clip();
  ctx.drawImage(cut(), x - R, y - R, R * 2, R * 2);
  if (st.env.rh > 68) { ctx.fillStyle = `rgba(56,104,150,${Math.min(0.28, (st.env.rh - 68) / 110)})`; ctx.fillRect(x - R, y - R, R * 2, R * 2); }
  const order = a => a.speck ? 1 : SPECIES[a.s].colony ? 0 : 2;
  agents.sort((p, q) => order(p) - order(q));
  for (const a of agents) {
    const sp = SPECIES[a.s];
    if (sp.speed && !a.speck) {
      a.a += (Math.random() - 0.5) * 3 * dt; const v = sp.speed * 1.4;
      a.u += Math.cos(a.a) * v * dt; a.v += Math.sin(a.a) * v * dt;
      if (a.u * a.u + a.v * a.v > 0.72) a.a = Math.atan2(-a.v, -a.u) + (Math.random() - 0.5);
    } else if (a.speck) { a.u += (Math.random() - 0.5) * 0.004; a.v += (Math.random() - 0.5) * 0.004; if (a.u * a.u + a.v * a.v > 0.85) { a.u *= 0.95; a.v *= 0.95; } }
    const px = x + a.u * R, py = y + a.v * R;
    if (a.speck) { ctx.fillStyle = sp.ink; ctx.globalAlpha = 0.75; ctx.beginPath(); ctx.arc(px, py, a.size, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
    else drawOrganism(ctx, a.s, px, py, a.size, sp.colony ? a.r * 6 : a.a, t + a.ph, { seed: a.seed });
  }
  ctx.restore();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * (R - 10), y + Math.sin(a) * (R - 10)); ctx.lineTo(x + Math.cos(a) * R, y + Math.sin(a) * R); ctx.stroke(); }
  // scale bar, fixed top-left like microscope software
  const bw = R * 0.45, bx = 20, by = area.t + 26;
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + bw, by); ctx.moveTo(bx, by - 5); ctx.lineTo(bx, by + 5); ctx.moveTo(bx + bw, by - 5); ctx.lineTo(bx + bw, by + 5); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = '12px "Helvetica Neue", Helvetica, Arial, sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(W < 600 ? TIERS[tier].bar : `${TIERS[tier].bar}  ·  ${TIERS[tier].name} ${TIERS[tier].mag}`, bx, by + 20);
}

// ---------- boot ----------
log('session_start', { ua: navigator.userAgent.slice(0, 120), w: innerWidth, h: innerHeight, speed: SPEED });
show('home'); layout(); requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => { if (document.hidden) { log('session_hide', {}); } });
</script>
</body>
</html>
